<style>
  body { margin:0; padding:16px; background:#fff; font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif; color:#333; }

  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns div { flex:1; text-align:center; padding:10px; border-radius:14px; color:#fff; font-weight:700; font-size:13px; }
